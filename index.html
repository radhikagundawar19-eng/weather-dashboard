<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <!-- Header -->
            <header class="header">
                <h1>🌤️ Weather Dashboard</h1>
                <p class="subtitle">Real-time weather information</p>
            </header>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="cityInput" 
                        placeholder="Enter city name..." 
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="btn-search">
                        <i class="fas fa-search"></i> Search
                    </button>
                    <button id="locationBtn" class="btn-location" title="Use current location">
                        <i class="fas fa-location-dot"></i>
                    </button>
                </div>
                <div id="suggestions" class="suggestions-list"></div>
            </div>

            <!-- Loading State -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Fetching weather data...</p>
            </div>

            <!-- Error Message -->
            <div id="error" class="error hidden"></div>

            <!-- Current Weather -->
            <div id="currentWeather" class="current-weather hidden">
                <div class="weather-main">
                    <div class="location-info">
                        <h2 id="cityName"></h2>
                        <p id="weatherDesc"></p>
                        <p id="feelsLike" class="feels-like"></p>
                    </div>
                    <div class="weather-icon-temp">
                        <i id="weatherIcon" class="fas fa-cloud"></i>
                        <div class="temperature">
                            <span id="temp" class="temp-value">--</span>
                            <span class="temp-unit">°C</span>
                        </div>
                    </div>
                </div>

                <!-- Weather Details Grid -->
                <div class="weather-details">
                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="fas fa-droplet"></i>
                        </div>
                        <div class="detail-info">
                            <p class="detail-label">Humidity</p>
                            <p id="humidity" class="detail-value">--%</p>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="fas fa-wind"></i>
                        </div>
                        <div class="detail-info">
                            <p class="detail-label">Wind Speed</p>
                            <p id="windSpeed" class="detail-value">-- m/s</p>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="fas fa-eye"></i>
                        </div>
                        <div class="detail-info">
                            <p class="detail-label">Visibility</p>
                            <p id="visibility" class="detail-value">-- km</p>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="fas fa-gauge"></i>
                        </div>
                        <div class="detail-info">
                            <p class="detail-label">Pressure</p>
                            <p id="pressure" class="detail-value">-- hPa</p>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="fas fa-sun"></i>
                        </div>
                        <div class="detail-info">
                            <p class="detail-label">UV Index</p>
                            <p id="uvIndex" class="detail-value">--</p>
                        </div>
                    </div>

                    <div class="detail-card">
                        <div class="detail-icon">
                            <i class="fas fa-cloud-rain"></i>
                        </div>
                        <div class="detail-info">
                            <p class="detail-label">Precipitation</p>
                            <p id="precipitation" class="detail-value">-- mm</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <div id="forecastSection" class="forecast-section hidden">
                <h3>5-Day Forecast</h3>
                <div id="forecast" class="forecast-container"></div>
            </div>

            <!-- Recent Searches -->
            <div class="recent-searches">
                <h3>Recent Searches</h3>
                <div id="recentList" class="recent-list"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
